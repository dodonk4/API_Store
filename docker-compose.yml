services:
  postgres:
    image: postgres:17
    container_name: api-store-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api_store_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d api_store_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: api-store-api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production

      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/api_store_dev

      AUTH_SECRET: your_access_secret
      AUTH_REFRESH_SECRET: your_refresh_secret

      AUTH_SECRET_EXPIRES_IN: 15m
      AUTH_REFRESH_SECRET_EXPIRES_IN: 24h

volumes:
  postgres_data: